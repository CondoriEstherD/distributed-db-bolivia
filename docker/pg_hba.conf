# Control de acceso por red de cada nodo (montado en /etc/postgresql/pg_hba.conf).
# Solo redes privadas; nunca internet. Todas las conexiones remotas con SCRAM.
# TIPO  BASE  USUARIO  DIRECCIÓN          MÉTODO
local   all   all                         trust           # consola local del servidor (docker exec)
host    all   all      127.0.0.1/32       scram-sha-256
host    all   all      10.0.0.0/8         scram-sha-256
host    all   all      172.16.0.0/12      scram-sha-256   # redes de Docker
host    all   all      192.168.0.0/16     scram-sha-256   # LAN con router propio
host    all   all      100.64.0.0/10      scram-sha-256   # Tailscale (WAN simulada)
